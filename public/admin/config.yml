# Decap CMS — content editor for spacescape.co.in
# Open https://spacescape.co.in/admin/ (or http://localhost:3000/admin/ locally).
# Every save is a Git commit to `main`, which triggers the GitHub Pages deploy.

backend:
  name: github
  repo: spacescapevisualisation-dev/web
  branch: main
  # GitHub login is handled by the small OAuth service in /api (deployed on
  # Vercel). Replace with the URL Vercel gives that project if it differs.
  base_url: https://cms.spacescape.co.in
  auth_endpoint: api/auth
  commit_messages:
    create: "CMS: add {{collection}} “{{slug}}”"
    update: "CMS: update {{collection}} “{{slug}}”"
    delete: "CMS: delete {{collection}} “{{slug}}”"
    uploadMedia: "CMS: upload “{{path}}”"
    deleteMedia: "CMS: delete “{{path}}”"

# `npx decap-server` + `npm run dev` lets you edit locally without logging in.
local_backend: true

site_url: https://spacescape.co.in
display_url: https://spacescape.co.in
logo_url: /favicon.ico

media_folder: public/project-images/uploads
public_folder: /project-images/uploads

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: Portfolio projects shown on the homepage and at /projects/<url>/. Lower “Display order” appears first.
    folder: content/projects
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{order}} · {{name}} — {{location}} ({{discipline}})"
    sortable_fields: [order, name, year]
    fields:
      - { label: Project name, name: name, widget: string }
      - label: Page URL
        name: slug
        widget: string
        required: false
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Lowercase letters, numbers and dashes only (e.g. private-residence-5)"]
        hint: "Becomes spacescape.co.in/projects/<this>/. Leave blank to generate it from the name. Changing it breaks old links."
      - { label: Display order, name: order, widget: number, value_type: int, default: 99, hint: "Lower numbers appear first (0 = top)." }
      - { label: Location, name: location, widget: string, default: "Pune, India" }
      - { label: Year, name: year, widget: string, default: "2026" }
      - { label: Architect / design studio, name: architect, widget: string }
      - { label: Developer, name: developer, widget: string, required: false }
      - { label: Category label, name: category, widget: string, hint: "Shown above the title, e.g. “Residential Interior Design”." }
      - label: Portfolio category (filter)
        name: discipline
        widget: select
        options: [Exterior, Interior]
        default: Exterior
      - label: Typology
        name: typology
        widget: select
        options: [Residential, Commercial, Mixed-Use, Hospitality, Cultural, Civic]
        default: Residential
      - label: Status
        name: status
        widget: select
        options: [Completed, In Progress, Concept]
        default: Completed
      - { label: Project size, name: size, widget: string, required: false, hint: "e.g. Private residence, 21,000 m²" }
      - { label: Short introduction, name: desc, widget: text, hint: "One or two sentences. Used on cards and in search results." }
      - { label: Full description, name: desc2, widget: text }
      - { label: Main image, name: mainImageUrl, widget: image, choose_url: false }
      - { label: Second image, name: secondaryImageUrl, widget: image, choose_url: false }
      - { label: Third image, name: tertiaryImageUrl, widget: image, required: false, choose_url: false }
      - { label: Fourth image, name: quaternaryImageUrl, widget: image, required: false, choose_url: false }
      - label: More gallery images
        name: additionalImageUrls
        widget: list
        required: false
        field: { label: Image, name: image, widget: image, choose_url: false }
        hint: "Shown after the first four. Drag to reorder."
      - { label: Image description (alt text), name: imageAlt, widget: string, hint: "Describe the main image for screen readers and Google." }
      - label: Homepage tile shape
        name: span
        widget: select
        default: std
        options:
          - { label: Standard, value: std }
          - { label: Wide, value: wide }
          - { label: Tall, value: tall }
      - label: Gallery alignment
        name: align
        widget: select
        default: left
        options: [left, right, full]
      - label: Placeholder colour (before images load)
        name: scene
        widget: select
        required: false
        options: [s1, s2, s3, s4, s5, s6]
      - label: Secondary placeholder colour
        name: sceneB
        widget: select
        required: false
        options: [s1, s2, s3, s4, s5, s6]
      - { label: Hide from website (draft), name: draft, widget: boolean, default: false, required: false }

  - name: settings
    label: Site settings
    editor: { preview: false }
    files:
      - name: site
        label: Contact, email & careers
        file: content/settings/site.json
        fields:
          - label: Contact email
            name: contactEmail
            widget: string
            pattern: ["^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "Enter a valid email address"]
            hint: Used by “Contact us”, the menu, and the contact section.
          - { label: Inquiry email subject, name: inquirySubject, widget: string }
          - { label: Instagram handle, name: instagramHandle, widget: string }
          - { label: Instagram link, name: instagramUrl, widget: string }
          - { label: Location, name: location, widget: string }
          - { label: Menu footer line, name: menuFooter, widget: string }
          - { label: Contact heading, name: contactTitle, widget: string }
          - { label: Contact button text, name: contactButton, widget: string }
          - label: Careers email
            name: careersEmail
            widget: string
            pattern: ["^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "Enter a valid email address"]
          - { label: Careers email subject, name: careersSubject, widget: string }
          - { label: Careers button text, name: careersButton, widget: string }
          - label: Job openings
            name: openings
            widget: list
            required: false
            summary: "{{fields.title}} — {{fields.type}}"
            fields:
              - { label: Role, name: title, widget: string }
              - { label: Type, name: type, widget: string, hint: "e.g. Full-time · Pune" }
              - { label: Description, name: blurb, widget: text }
